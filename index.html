<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f2e6">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Buku Latihan TOCFL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Instrument+Serif:ital@0;1&family=Nothing+You+Could+Do&display=swap">
<style>
/* Layout: "about my study" profile card — cream page, cobalt ink, ruled form rows filled in by hand, blue tag sticker, soft blue and butter blocks, pill buttons, thin cobalt rules */
:root{
  --paper:#f8f2e6; --surface:#fffdf8; --ink:#1f2a52; --muted:#6a7396; --line:#c9d5ef; --hair:#e3e9f6; --grid:#eef3fc;
  --cobalt:#2350c2; --cobalt-ink:#1a3e9c; --sky:#d6e3f8; --butter:#fbf1bd; --hand:#4b3aa0; --on-cobalt:#fffdf8; --tape:#2350c2;
  --red:#2350c2; --red-ink:#1a3e9c; --red-soft:#e3ecfb; --on-red:#fffdf8;
  --rose:#2350c2; --rose-deep:#1a3e9c; --blush:#d6e3f8; --blush-2:#b9cdf1; --lilac:#eef3fc; --cream:#fffdf8;
  --maroon:#1a3e9c; --pink:#d6e3f8; --blue:#d6e3f8; --olive:#fbf1bd; --gold:#2350c2; --gold-soft:#fbf1bd;
  --jade:#2350c2; --jade-soft:#e3ecfb; --seal:#2350c2; --seal-soft:#e3ecfb; --amber:#b5891d; --on-rose:#fffdf8;
  --ok:#2c7a57; --ok-soft:#e1f1e8; --bad:#b4413a; --bad-soft:#f8e3e1;
  --f-han:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Instrument Serif","Times New Roman",serif;
  --f-hand:"Nothing You Could Do","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11162a; --surface:#171d36; --ink:#e8ecfb; --muted:#9ea8cc; --line:#2d3864; --hair:#232c50; --grid:#1c2442;
  --cobalt:#8fadff; --cobalt-ink:#b3c8ff; --sky:#22305e; --butter:#3a3620; --hand:#c4b6ff; --on-cobalt:#11162a; --tape:#8fadff;
  --red:#8fadff; --red-ink:#b3c8ff; --red-soft:#22305e; --on-red:#11162a;
  --rose:#8fadff; --rose-deep:#b3c8ff; --blush:#22305e; --blush-2:#2d3c74; --lilac:#1c2442; --cream:#171d36;
  --maroon:#b3c8ff; --pink:#22305e; --blue:#22305e; --olive:#3a3620; --gold:#8fadff; --gold-soft:#3a3620;
  --jade:#8fadff; --jade-soft:#22305e; --seal:#8fadff; --seal-soft:#22305e; --amber:#e3bb5c; --on-rose:#11162a;
  --ok:#83cfa6; --ok-soft:#1b3328; --bad:#f09089; --bad-soft:#3a2023; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11162a; --surface:#171d36; --ink:#e8ecfb; --muted:#9ea8cc; --line:#2d3864; --hair:#232c50; --grid:#1c2442;
  --cobalt:#8fadff; --cobalt-ink:#b3c8ff; --sky:#22305e; --butter:#3a3620; --hand:#c4b6ff; --on-cobalt:#11162a; --tape:#8fadff;
  --red:#8fadff; --red-ink:#b3c8ff; --red-soft:#22305e; --on-red:#11162a;
  --rose:#8fadff; --rose-deep:#b3c8ff; --blush:#22305e; --blush-2:#2d3c74; --lilac:#1c2442; --cream:#171d36;
  --maroon:#b3c8ff; --pink:#22305e; --blue:#22305e; --olive:#3a3620; --gold:#8fadff; --gold-soft:#3a3620;
  --jade:#8fadff; --jade-soft:#22305e; --seal:#8fadff; --seal-soft:#22305e; --amber:#e3bb5c; --on-rose:#11162a;
  --ok:#83cfa6; --ok-soft:#1b3328; --bad:#f09089; --bad-soft:#3a2023; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}
.han{font-family:var(--f-han)}
h1,h2,h3{text-wrap:balance;margin:0;color:var(--cobalt)}
h2{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-transform:lowercase}
h2.han{text-transform:none;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{border:1.5px solid var(--cobalt);background:var(--surface);color:var(--cobalt);border-radius:999px;padding:8px 16px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.btn.primary{background:var(--cobalt);color:var(--on-cobalt)}
.btn:disabled{opacity:.35;cursor:default}
.chip{border:1.5px solid var(--cobalt);background:var(--surface);color:var(--cobalt);border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--cobalt);color:var(--on-cobalt)}
a{color:var(--cobalt);font-weight:600;text-underline-offset:3px}
em.ser,.ser{font-family:var(--f-serif);font-style:italic;font-weight:400}

/* hero: profile card */
.hero{position:relative;background:var(--surface);border-radius:20px;padding:26px 18px 16px;margin:14px 0 18px;box-shadow:0 1px 0 var(--line)}
.tagline{position:absolute;top:-12px;left:20px;background:var(--cobalt);color:var(--on-cobalt);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;transform:rotate(-3deg)}
.htitle{font-family:var(--f-serif);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1;color:var(--cobalt);letter-spacing:-.01em}
.htitle .han{font-family:var(--f-han);font-weight:700;font-size:.78em;letter-spacing:.04em}
.htitle small{font-family:var(--f-body);font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blush-2);margin-left:6px;vertical-align:middle}
.form{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin-top:16px}
.frow{display:flex;align-items:baseline;gap:8px;padding:7px 10px;border-top:1px solid var(--ink);min-width:0;grid-column:1/-1;flex-wrap:wrap}
.frow:first-child{border-top:none}
.frow.half{grid-column:auto}
.frow.half+.frow.half{border-left:1px solid var(--ink)}
.frow .k{font-size:13.5px;color:var(--ink);white-space:nowrap}
.frow .v{font-family:var(--f-hand);font-size:17px;color:var(--hand);line-height:1.2;min-width:0}
.frow .v.big{font-size:26px;line-height:1}
.frow .v .han{font-family:var(--f-han);font-size:17px}
.sync{font-size:11px;color:var(--muted);margin-top:10px}
.hero .motto{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;min-width:0}
.hero .motto .mean{grid-column:1}
.hero .motto button{grid-column:2;grid-row:1 / span 2}
.hero .motto .han{font-size:17px;color:var(--hand)}
.hero .motto .mean{font-family:var(--f-hand);font-size:15px;color:var(--hand);min-width:0}
.hero .motto .py{display:none}
.hero .motto button{width:28px;height:28px;border:1.5px solid var(--cobalt);color:var(--cobalt);background:transparent;border-radius:50%;font-size:10px}
.stripes{height:18px;border-radius:999px;margin:0 0 18px;background:repeating-linear-gradient(90deg,var(--sky) 0 10px,var(--surface) 10px 20px);border:1px solid var(--line)}

/* phase card */
.phase{background:var(--sky);border-color:transparent}
.phase h2{font-size:20px}
.frame{flex:none;display:block}
.frame svg{display:none}
.frame .han-big{font-size:28px;line-height:1.05;color:var(--cobalt)}
details{margin:6px -18px -18px;border-top:1px solid var(--cobalt)}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;font-weight:700;font-size:14px;color:var(--cobalt)}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:20px;line-height:1;font-weight:400}
details[open] summary::after{content:"–"}
.gram{display:flex;flex-direction:column;gap:16px;padding:0 18px 18px}
.gram .pat{font-weight:700;color:var(--cobalt)}
.ex{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface);border-radius:12px;margin-top:6px}
.ex .han{font-size:20px}
.speak{border:none;background:transparent;color:var(--cobalt);padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
.speak:hover{background:var(--grid)}

/* checklist */
.check{display:flex;flex-direction:column;margin:0 -18px -18px}
.task{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;padding:14px 18px;border-top:1px solid var(--line)}
.box{width:20px;height:20px;border:1.5px solid var(--cobalt);border-radius:50%;background:var(--surface);display:grid;place-items:center;padding:0;font-size:11px;color:var(--on-cobalt);margin-top:3px}
.task.done .box{background:var(--cobalt)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:700}
.t-min{font-family:var(--f-serif);font-style:italic;font-size:15px;color:var(--muted);white-space:nowrap}
.t-body{min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.go{border:1.5px solid var(--cobalt);background:none;color:var(--cobalt);font-weight:700;padding:3px 12px;border-radius:999px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px;border-radius:16px;background:var(--surface)!important;border:1px solid var(--line)}
.stat:nth-child(1){background:var(--sky)!important;border-color:transparent}
.stat:nth-child(2){background:var(--butter)!important;border-color:transparent}
.stat b{font-family:var(--f-serif);font-size:38px;font-weight:400;line-height:1;display:block;color:var(--cobalt)!important}
.stat .small{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)!important;opacity:.75}
.bar{height:8px;background:var(--hair);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:999px}

/* plan */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--grid);font-size:10px;display:grid;place-items:center;color:var(--muted)}
.day.l1{background:var(--sky);color:var(--cobalt)}
.day.l2{background:var(--blush-2);color:var(--cobalt-ink)}
.day.l3{background:var(--cobalt);color:var(--on-cobalt)}
.day.today{outline:1.5px solid var(--cobalt);outline-offset:2px}
.day.exam{background:var(--butter);color:var(--ink);font-weight:800}
.pl{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:none}
.pl.cur{background:var(--sky);margin-inline:-18px;padding-inline:18px}
.pl .d{font-size:11px;color:var(--muted)}

/* flashcard */
.card{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 16px;position:relative}
.card .h{font-family:var(--f-han);font-size:clamp(60px,17vw,92px);line-height:1.05;font-weight:500;color:var(--ink)}
.card .p{font-size:18px;color:var(--cobalt);font-weight:600}
.card .m{font-family:var(--f-hand);font-size:22px;color:var(--hand)}
.card .tag{position:absolute;top:-10px;left:18px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--on-cobalt);background:var(--cobalt);padding:3px 9px;transform:rotate(-3deg)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{padding:11px 8px}
.r0{background:var(--surface)!important}
.r2{background:var(--cobalt)!important;color:var(--on-cobalt)!important}

/* quiz */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}

/* vocab list */
.vl{display:flex;flex-direction:column}
.vr{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vr .han{font-size:26px;text-align:center}
.vr .pp{color:var(--cobalt);font-size:13px;font-weight:600}
.vr>div{min-width:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--hair);margin-right:6px;vertical-align:middle;border:1px solid var(--line)}
.dot.s1{background:var(--butter);border-color:var(--amber)}.dot.s2{background:var(--cobalt);border-color:var(--cobalt)}
input[type=text],input[type=search],input[type=date],input[type=number],textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
form.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:none;margin:0}
.form .full{grid-column:1/-1}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.clean li::marker{content:"✶  ";color:var(--cobalt)}
.seal{display:inline-grid;place-items:center;width:44px;height:44px;flex:none;background:var(--butter);color:var(--cobalt);border-radius:50%;font-family:var(--f-han);font-weight:700;font-size:16px;line-height:1;transform:rotate(-6deg)}
.note{padding:12px 14px;border-radius:14px;background:var(--butter);font-size:13px}

/* lessons */
.lesson-pill{display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--sky);border-radius:999px;padding:3px 14px;margin:2px 0}
.lesson-pill .han{font-size:16px;color:var(--cobalt)}
.steps{margin:0;padding:12px 14px 12px 32px;background:var(--grid);border-radius:14px;display:flex;flex-direction:column;gap:4px}
.kind-tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--on-cobalt);background:var(--cobalt);padding:3px 9px;transform:rotate(3deg)}
.doc{display:flex;flex-direction:column}
.lv-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--hair);border-radius:8px;transition:background .2s}
.lv-line.has-sp{grid-template-columns:auto 1fr auto}
.lv-line:first-child{border-top:none}
.lv-line.now{background:var(--sky)}
.lv-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.lv-line .zh{font-size:21px;line-height:1.45}
.pp{font-size:12.5px;color:var(--cobalt);line-height:1.45;font-weight:500}
.mn{font-family:var(--f-hand);font-size:16px;color:var(--hand);line-height:1.3}
.hidden-line{font-size:22px;letter-spacing:.2em;color:var(--line);line-height:1.4}
.sp{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--cobalt);color:var(--cobalt);overflow:hidden;white-space:nowrap}
.sp-b{background:var(--cobalt);color:var(--on-cobalt)}
.doc-notice,.doc-menu,.doc-card{border:1px solid var(--ink);border-radius:2px;padding:6px 14px;background:var(--surface)}
.doc-notice .lv-line:first-child .zh{font-weight:700}
.doc-card{max-width:420px}
.doc-card .lv-line:first-child .zh{font-size:26px}
.doc-diary{padding:4px 14px;background:repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px)}
.doc-chat .lv-line{border:none;padding:6px 0}
.doc-chat .lv-txt{background:var(--grid);border-radius:16px 16px 16px 4px;padding:8px 12px}
.doc-chat .lv-line .sp{width:auto;padding:0 8px;border-radius:999px;height:22px;font-size:11px}
.doc-chat .sp-b+.lv-txt{background:var(--sky);border-radius:16px 16px 4px 16px}
.doc-chat .lv-line .zh{font-size:19px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px 4px}
.tabs button{border:none;background:none;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:lowercase}
.tabs button .han{font-size:19px;line-height:1;width:44px;height:32px;display:grid;place-items:center;border-radius:999px}
.tabs button[aria-current="page"]{color:var(--cobalt)}
.tabs button[aria-current="page"] .han{background:var(--cobalt);color:var(--on-cobalt)}

/* stroke sheet */
.sheet[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(17,22,42,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;
  padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.hwbox{width:260px;height:260px;max-width:100%;margin:0 auto;border:1.5px solid var(--cobalt);border-radius:4px;
  background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,var(--surface)}
.hwbox svg{display:block}
.ctabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ctabs button{font-family:var(--f-han);font-size:22px;width:46px;height:46px;border:1.5px solid var(--line);border-radius:50%;background:var(--surface)}
.ctabs button[aria-pressed="true"]{border-color:var(--cobalt);color:var(--on-cobalt);background:var(--cobalt)}
.hwctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hwctl .btn{padding:10px 6px}
@media (max-width:420px){.stat b{font-size:30px}.opts{grid-template-columns:1fr}.pl{grid-template-columns:1fr;gap:4px}.frow.half{grid-column:1/-1}.frow.half+.frow.half{border-left:none;border-top:1px solid var(--ink)}}
</style>
</head>
<body>


<div class="wrap">
  <header class="hero">
    <span class="tagline">TOCFL · A2</span>
    <h1 class="htitle">“tell me about my <span class="han">華語</span>”<small>card</small></h1>
    <div class="form">
      <div class="frow"><span class="k">Misi:</span><span class="v">lulus TOCFL CAT level A2 ✶</span></div>
      <div class="frow half"><span class="k">Hari tes:</span><span class="v" id="cdDate"></span></div>
      <div class="frow half"><span class="k">Sisa:</span><span class="v big"><b class="num" id="cd" style="font-weight:400">–</b> hari</span></div>
      <div class="frow"><span class="k">Fase sekarang:</span><span class="v" id="hPhase"></span></div>
      <div class="frow half"><span class="k">Kata kuat:</span><span class="v" id="hKnown"></span></div>
      <div class="frow half"><span class="k">Aksara:</span><span class="v"><span class="han">繁體</span> tradisional</span></div>
      <div class="frow"><span class="k">Mantra hari ini:</span><span class="motto" id="motto" style="flex:1"></span></div>
    </div>
    <div class="sync" id="sync">Progres tersimpan di browser ini · cadangan ada di tab Rencana</div>
  </header>
  <div class="stripes" aria-hidden="true"></div>

let voice=null;

  try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh[-_](CN|HK)/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}catch(e){}
}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:"zh-TW";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u);return true}catch(e){return false}
}

/* ---------- SRS ---------- */
function status(w){const r=S.srs[w.id];if(!r)return 0;return r.b>=3?2:1}
function dueList(){const t=today();return allWords().filter(w=>S.srs[w.id]&&S.srs[w.id].d<=t)}
function introducedToday(){const t=today();return allWords().filter(w=>S.srs[w.id]&&S.srs[w.id].s===t).length}
function unseenPool(){const ws=allWords().filter(w=>!S.srs[w.id]);return ws.filter(w=>w.ph>0).concat(ws.filter(w=>w.ph===0))}
function rate(w,g){
  const t=today();const r=S.srs[w.id]||{b:0,s:t};
  if(g===0){r.b=0;r.d=t}else if(g===1){r.b=Math.max(1,r.b);r.d=addDays(t,1)}else{r.b=Math.min(r.b+1,INT.length-1);r.d=addDays(t,INT[r.b])}
  S.srs[w.id]=r;
}
function markTask(id,on){const t=today();const a=new Set(S.done[t]||[]);on?a.add(id):a.delete(id);S.done[t]=[...a];save()}
function tasksFor(s){
  const ph=phaseOf(s),dow=parse(s).getDay(),dl=diff(s,S.examDate);
  if(dl===0)return [];
  if(dl===1)return ["rest"];
  if(ph.id===7)return dow===0?["srs","audio"]:["srs","audio","mock","read"];
  if(dow===6)return ph.id>=4?["srs","new","mock","weekly"]:["srs","new","weekly","audio"];
  if(dow===0)return ["srs","audio"];
  return ["srs","new","audio","gram","listen","read"];
}
function dayLevel(s){const ts=tasksFor(s);if(!ts.length)return 0;const n=(S.done[s]||[]).filter(x=>ts.includes(x)).length;if(!n)return 0;const f=n/ts.length;return f>=1?3:f>=.5?2:1}

function lessonFor(kind,s){
  const ph=phaseOf(s),day=Math.max(0,diff(ph.from,s));
  let gi;
  if(ph.id<=6){const pool=LESSONS[ph.id][kind];const base=ALL[kind].findIndex(x=>x.ph===ph.id);gi=base+(day%pool.length)}
  else gi=(day*3)%ALL[kind].length;
  return {gi,it:ALL[kind][gi]};

let LV=null,playTok=0;

    u.rate=slow?.7:.95;u.pitch=spk==="B"||spk==="小珍"?1.3:.9;u.onend=done||null;u.onerror=done||null;speechSynthesis.speak(u);return true}catch(e){if(done)done();return false}

  try{speechSynthesis.cancel()}catch(e){}

  const next=()=>{if(tok!==playTok)return;
    document.querySelectorAll(".lv-line").forEach((el,k)=>el.classList.toggle("now",k===i));
    if(i>=it.l.length){document.querySelectorAll(".lv-line").forEach(el=>el.classList.remove("now"));if(b)b.textContent="▶ Putar lagi";return}

/* ---- cards ---- */
let session=null;
function startSession(kind){
  let q;
  if(kind==="new"){const left=Math.max(0,S.newPerDay-introducedToday());q=unseenPool().slice(0,Math.min(left,10))}
  else q=dueList().sort(()=>Math.random()-.5);
  session={kind,q,i:0,shown:false,again:new Set(),n:q.length};
  render();
}
function rCards(){
  if(session&&session.i<session.q.length)return rCard();
  const due=dueList().length,left=Math.max(0,S.newPerDay-introducedToday()),pool=unseenPool().length;
  const finished=session&&session.n>0;
  if(finished){if(session.kind==="srs"&&!dueList().length)markTask("srs",true);if(session.kind==="new"&&introducedToday()>=S.newPerDay)markTask("new",true)}
  const fk=finished?session.kind:null;session=null;
  V.innerHTML=`
  ${fk?`<div class="panel row"><span class="seal">好</span><p>${fk==="new"?"Kata baru hari ini selesai dibuka.":"Sesi ulang selesai."} Tugasnya sudah dicentang otomatis.</p></div>`:""}
  <section class="panel stack">
    <div><h2>Ulang kartu</h2><p class="small muted">Kartu yang jadwal ulangnya hari ini atau sudah lewat.</p></div>
    <button class="btn primary" id="sDue" ${due?"":"disabled"}>${due?`Mulai ${due} kartu`:"Tidak ada kartu jatuh tempo"}</button>
  </section>
  <section class="panel stack">
    <div><h2>Kata baru</h2><p class="small muted">${left?`Masih ${left} kata baru untuk hari ini, diambil berurutan dari deck.`:"Jatah kata baru hari ini sudah habis."}${pool?` Sisa ${pool} kata belum dibuka.`:" Semua kata di deck sudah dibuka; tambahkan kata dari daftar resmi di tab Kosakata."}</p></div>
    <button class="btn" id="sNew" ${left&&pool?"":"disabled"}>Buka ${Math.min(left,pool,10)} kata baru</button>
    <p class="small muted">Tips: buka dalam 2–3 sesi kecil (misalnya 10 pagi, 10 siang, 5 malam), bukan 25 sekaligus.</p>
    <label class="row small"><span>Kata baru per hari</span><input type="number" id="npd" min="5" max="40" value="${S.newPerDay}" style="width:80px"></label>
  </section>
  <section class="panel stack small">
    <h3>Cara pakai kartu</h3>
    <ul class="clean">
      <li>Lihat karakternya, coba ingat bunyi dan artinya, lalu ketuk kartu.</li>
      <li><b>Lupa</b> → muncul lagi di sesi ini. <b>Ragu</b> → besok. <b>Ingat</b> → jarak ulang makin panjang (1, 2, 4, 7, 14, 30 hari).</li>
      <li>Di kereta tanpa suara: pakai earphone, tekan ▶ untuk dengar pengucapan.</li>
      <li><b>✍ Guratan</b> menunjukkan urutan menulis dan bisa dipakai latihan menulis dengan jari. CAT tidak menguji menulis tangan, jadi pakai ini untuk karakter yang mirip-mirip atau susah diingat, bukan untuk semua kata.</li>
    </ul>
    ${hasVoice()?"":`<p class="note">Suara Mandarin belum terdeteksi di perangkat ini. Kalau tombol ▶ tidak bersuara, tambahkan suara "Chinese (Taiwan)" di pengaturan text-to-speech HP/laptop.</p>`}
  </section>`;
  document.getElementById("sDue").onclick=()=>startSession("srs");
  document.getElementById("sNew").onclick=()=>startSession("new");
  document.getElementById("npd").onchange=e=>{const v=Math.max(5,Math.min(40,+e.target.value||25));S.newPerDay=v;save();render()};
}
function rCard(){
  const s=session,w=s.q[s.i];
  V.innerHTML=`
  <div class="row" style="justify-content:space-between"><span class="small muted num">${s.kind==="new"?"Kata baru":"Ulang"} · ${s.i+1}/${s.q.length}</span><button class="btn" id="quit">Selesai dulu</button></div>
  <div class="bar"><i style="width:${s.i/s.q.length*100}%"></i></div>
  <button class="card" id="card" aria-label="Balik kartu">
    <span class="tag">Fase ${w.ph||"+"}</span>
    <span class="h">${esc(w.h)}</span>
    ${s.shown||s.kind==="new"?`<span class="p">${esc(w.p)}</span><span class="m">${esc(w.m)}</span>`:`<span class="small muted">Ketuk untuk lihat jawaban</span>`}
  </button>
  <div class="row" style="justify-content:center"><button class="btn" id="say">▶ Dengar</button><button class="btn" data-stroke="${esc(w.h)}">✍ Guratan</button></div>
  ${s.shown||s.kind==="new"?(s.kind==="new"?`<button class="btn primary" id="next">Sudah dicatat, lanjut</button>`:
   `<div class="rate"><button class="btn r0" data-g="0">Lupa</button><button class="btn" data-g="1">Ragu</button><button class="btn r2" data-g="2">Ingat</button></div>`):""}`;
  const say=()=>speak(w.h);
  document.getElementById("say").onclick=say;
  document.getElementById("card").onclick=()=>{if(!s.shown){s.shown=true;say();rCard()}};
  document.getElementById("quit").onclick=()=>{session.q=session.q.slice(0,session.i);render()};
  if(s.kind==="new"&&!s.spoken){s.spoken=true}
  const nx=document.getElementById("next");
  if(nx)nx.onclick=()=>{const t=today();S.srs[w.id]={b:0,d:addDays(t,1),s:t};save();s.i++;s.shown=false;render()};
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g;rate(w,g);save();
    if(g===0&&!s.again.has(w.id)){s.again.add(w.id);s.q.push(w)}
    s.i++;s.shown=false;render();
  });
}

  pool=pool.sort(()=>Math.random()-.5).slice(0,10);
  quiz={mode,items:pool.map(w=>{const others=words.filter(o=>o.m!==w.m).sort(()=>Math.random()-.5).slice(0,3);return {w,opts:[w,...others].sort(()=>Math.random()-.5)}}),i:0,score:0,picked:null,wrong:[]};
  render();if(mode==="listen")setTimeout(()=>speak(quiz.items[0].w.h),250);
}

      <ul class="clean">
        <li><a href="https://tocfl.edu.tw/tocfl/index.php/exam/test/page/20" target="_blank" rel="noopener">Simulasi tes resmi TOCFL</a> — wajib mulai fase 5.</li>
        <li>Shadowing: putar contoh kalimat di tab Hari ini, ulangi dengan nada yang sama.</li>
      </ul>
    </section>`;
    document.getElementById("qL").onclick=()=>newQuiz("listen");
    document.getElementById("qR").onclick=()=>newQuiz("read");
    return;
  }
  const q=quiz;
  if(q.i>=q.items.length){
    V.innerHTML=`<section class="panel stack" style="align-items:center;text-align:center"><span class="seal">${q.score>=8?"優":q.score>=6?"好":"練"}</span>
      <h2 class="num">${q.score}/10</h2><p class="muted">${q.score>=8?"Mantap. Lanjutkan ritmenya.":"Kata yang salah sudah dikembalikan ke kartu untuk diulang hari ini."}</p>
      ${q.wrong.length?`<div class="vl" style="width:100%;text-align:left">${q.wrong.map(w=>`<div class="vr"><span class="han">${esc(w.h)}</span><div><div class="pp">${esc(w.p)}</div><div class="small">${esc(w.m)}</div></div><div class="row" style="gap:2px;flex-wrap:nowrap"><button class="speak" data-say="${esc(w.h)}">▶</button><button class="speak" data-stroke="${esc(w.h)}" aria-label="Urutan guratan">✍</button></div></div>`).join("")}</div>`:""}
      <div class="row"><button class="btn primary" id="again">Kuis lagi</button><button class="btn" id="back">Kembali</button></div></section>`;
    document.getElementById("again").onclick=()=>newQuiz(q.mode);
    document.getElementById("back").onclick=()=>{quiz=null;render()};
    return;
  }
  const it=q.items[q.i];
  V.innerHTML=`
  <div class="row" style="justify-content:space-between"><span class="small muted num">${q.mode==="listen"?"Listening":"Membaca"} · ${q.i+1}/10 · skor ${q.score}</span><button class="btn" id="qx">Keluar</button></div>
  <div class="card" style="min-height:200px">
    ${q.mode==="listen"?`<button class="btn primary" id="play" style="font-size:18px;padding:14px 22px">▶ Putar lagi</button>${q.picked?`<span class="h" style="font-size:44px">${esc(it.w.h)}</span><span class="p">${esc(it.w.p)}</span>`:`<span class="small muted">Dengarkan, lalu pilih artinya</span>`}`
     :`<span class="h">${esc(it.w.h)}</span>${q.picked?`<span class="p">${esc(it.w.p)}</span>`:""}`}
  </div>
  <div class="opts">${it.opts.map((o,k)=>{let c="";if(q.picked){if(o===it.w)c="ok";else if(o===q.picked)c="no"}return `<button class="opt ${c}" data-k="${k}" ${q.picked?"disabled":""}>${esc(o.m)}</button>`}).join("")}</div>
  ${q.picked?`<button class="btn primary" id="qn">Lanjut</button>`:""}`;
  const pl=document.getElementById("play");if(pl)pl.onclick=()=>speak(it.w.h);
  document.getElementById("qx").onclick=()=>{quiz=null;render()};
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const o=it.opts[+b.dataset.k];q.picked=o;
    if(o===it.w)q.score++;else{q.wrong.push(it.w);if(S.srs[it.w.id]){S.srs[it.w.id].b=0;S.srs[it.w.id].d=today()}}
    if(q.mode==="read")speak(it.w.h);
    rQuiz();
  });
  const qn=document.getElementById("qn");
  if(qn)qn.onclick=()=>{q.i++;q.picked=null;
    if(q.i>=q.items.length){S.quiz=(S.quiz||[]).concat([{d:today(),m:q.mode,s:q.score}]).slice(-30);if(q.mode==="listen")markTask("listen",true);save()}
    rQuiz();if(q.mode==="listen"&&q.i<q.items.length)setTimeout(()=>speak(q.items[q.i].w.h),200)};
}

/* ---- words ---- */
let wf={q:"",ph:"all"};
function rWords(){
  V.innerHTML=`
  <section class="panel stack">
    <div class="row" style="justify-content:space-between"><h2>Kosakata</h2><span class="small muted num" id="wc"></span></div>
    <input type="search" id="wq" placeholder="Cari karakter, pinyin, atau arti" value="${esc(wf.q)}">
    <div class="row" id="wph">${["all",1,2,3,4,5,6,0].map(p=>`<button class="chip" data-p="${p}" aria-pressed="${String(wf.ph)===String(p)}">${p==="all"?"Semua":p===0?"Tambahanku":"Fase "+p}</button>`).join("")}</div>
    <div class="small muted"><span class="dot"></span>belum dibuka <span class="dot s1" style="margin-left:10px"></span>sedang dipelajari <span class="dot s2" style="margin-left:10px"></span>kuat</div>
    <div class="vl" id="wl"></div>
  </section>
  <section class="panel stack">
    <div><h2>Tambah kata sendiri</h2><p class="small muted">Deck ini berisi ${BASE.length} kata. Untuk mencapai ±1.000 kata A2, tambahkan sisanya dari daftar kosakata resmi TOCFL, buku pelajaranmu, atau kata yang sering muncul di podcast dan simulasi.</p></div>
    <form class="form" id="af">
      <input type="text" id="ah" placeholder="漢字" required>
      <input type="text" id="ap" placeholder="pinyin" required>
      <input class="full" type="text" id="am" placeholder="arti" required>
      <button class="btn primary full" type="submit">Tambah ke deck</button>
    </form>
  </section>`;
  const list=()=>{
    const q=wf.q.trim().toLowerCase();
    const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
    const ws=allWords().filter(w=>(wf.ph==="all"||String(w.ph)===String(wf.ph))&&(!q||w.h.includes(wf.q.trim())||strip(w.p).replace(/\s/g,"").includes(strip(q).replace(/\s/g,""))||w.m.toLowerCase().includes(q)));
    document.getElementById("wc").textContent=ws.length+" kata";
    document.getElementById("wl").innerHTML=ws.map(w=>`<div class="vr"><span class="han">${esc(w.h)}</span><div><div class="pp"><span class="dot ${["","s1","s2"][status(w)]}"></span>${esc(w.p)}</div><div class="small">${esc(w.m)}</div></div><div class="row" style="gap:2px;flex-wrap:nowrap"><button class="speak" data-say="${esc(w.h)}" aria-label="Dengar ${esc(w.h)}">▶</button><button class="speak" data-stroke="${esc(w.h)}" aria-label="Urutan guratan ${esc(w.h)}">✍</button></div></div>`).join("")||`<p class="small muted" style="padding:12px 0">Tidak ada kata yang cocok.</p>`;
  };
  list();
  document.getElementById("wq").oninput=e=>{wf.q=e.target.value;list()};
  document.getElementById("wph").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;wf.ph=b.dataset.p==="all"?"all":+b.dataset.p;rWords()};
  document.getElementById("af").onsubmit=e=>{e.preventDefault();
    const h=document.getElementById("ah").value.trim(),p=document.getElementById("ap").value.trim(),m=document.getElementById("am").value.trim();
    if(!h||!p||!m)return;S.custom=(S.custom||[]).concat([{h,p,m}]);save();wf.ph=0;rWords()};
}

/* ---- stroke order ---- */
let HW=null,hwState=null;
const isHan=c=>/\p{Script=Han}/u.test(c);
function loadStrokes(){
  if(!HW)HW=fetch("strokes.json").then(r=>r.ok?r.json():{}).catch(()=>({}));
  return HW;
}
function charLoader(ch,onLoad,onError){
  loadStrokes().then(d=>{
    if(d[ch])return onLoad(d[ch]);
    fetch("https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/"+encodeURIComponent(ch)+".json").then(r=>r.ok?r.json():Promise.reject()).then(onLoad).catch(onError);
  });
}
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function openStroke(word){
  const chars=[...word].filter(isHan);if(!chars.length)return;
  try{speechSynthesis.cancel()}catch(e){}
  hwState={word,chars,i:0,writer:null,step:-1,count:0};
  document.getElementById("sheet").hidden=false;document.body.style.overflow="hidden";
  drawStroke();
}
function closeStroke(){document.getElementById("sheet").hidden=true;document.body.style.overflow="";hwState=null;document.getElementById("sheetIn").innerHTML=""}
function drawStroke(){
  const st=hwState,ch=st.chars[st.i],w=allWords().find(x=>x.h===st.word);
  const box=document.getElementById("sheetIn");
  box.innerHTML=`
    <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Urutan guratan</div><h2 class="han" style="font-size:24px">${esc(st.word)}</h2>${w?`<span class="small" style="color:var(--jade);font-weight:600">${esc(w.p)}</span> <span class="small muted">· ${esc(w.m)}</span>`:""}</div>
      <button class="btn" id="hwClose">Tutup</button></div>
    ${st.chars.length>1?`<div class="ctabs">${st.chars.map((c,k)=>`<button data-ci="${k}" aria-pressed="${k===st.i}">${esc(c)}</button>`).join("")}</div>`:""}
    <div class="hwbox" id="hwbox"></div>
    <p class="small muted" id="hwMsg" style="text-align:center;min-height:1.5em" aria-live="polite">Memuat guratan…</p>
    <div class="hwctl"><button class="btn primary" id="hwPlay">▶ Animasi</button><button class="btn" id="hwStep">Satu per satu</button><button class="btn" id="hwQuiz">✍ Tulis</button></div>
    <ul class="clean small muted">
      <li><b>Animasi</b>: lihat seluruh urutan. <b>Satu per satu</b>: ketuk berulang untuk tiap guratan.</li>
      <li><b>Tulis</b>: telusuri guratannya dengan jari. Petunjuk muncul setelah 2 kali salah.</li>
      <li>Aturan umum: atas ke bawah, kiri ke kanan, horizontal sebelum vertikal, luar sebelum isi, tutup paling akhir.</li>
    </ul>`;
  const msg=t=>{const m=document.getElementById("hwMsg");if(m)m.textContent=t};
  if(typeof HanziWriter==="undefined"){msg("Animasi guratan butuh koneksi internet untuk memuat pustakanya. Coba lagi saat online.");return}
  const size=Math.min(260,document.getElementById("hwbox").clientWidth||260);
  st.writer=HanziWriter.create("hwbox",ch,{width:size,height:size,padding:14,showOutline:true,
    strokeColor:cssVar("--ink"),outlineColor:cssVar("--hair"),radicalColor:cssVar("--jade"),drawingColor:cssVar("--seal"),highlightColor:cssVar("--jade"),
    strokeAnimationSpeed:1,delayBetweenStrokes:280,showHintAfterMisses:2,charDataLoader:charLoader,
    onLoadCharDataSuccess:d=>{st.count=d.strokes.length;msg(`${ch} · ${st.count} guratan · bagian berwarna hijau = radikal`)},
    onLoadCharDataError:()=>msg("Data guratan untuk karakter ini belum tersedia.")});
  st.step=-1;
  document.getElementById("hwClose").onclick=closeStroke;
  document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{st.i=+b.dataset.ci;drawStroke()});
  document.getElementById("hwPlay").onclick=()=>{st.step=-1;st.writer.cancelQuiz&&st.writer.cancelQuiz();st.writer.showCharacter();st.writer.animateCharacter();msg(`${ch} · ${st.count} guratan`)};
  document.getElementById("hwStep").onclick=()=>{
    st.writer.cancelQuiz&&st.writer.cancelQuiz();
    if(st.step<0||st.step>=st.count-1){st.writer.hideCharacter();st.step=-1}
    st.step++;st.writer.animateStroke(st.step);msg(`Guratan ${st.step+1} dari ${st.count}`);
  };
  document.getElementById("hwQuiz").onclick=()=>{st.step=-1;msg("Tulis guratan pertama…");
    st.writer.quiz({onCorrectStroke:s=>msg(`Guratan ${s.strokeNum+1} dari ${st.count} benar`),onMistake:()=>msg("Belum tepat, coba lagi"),
      onComplete:s=>msg(s.totalMistakes?`Selesai dengan ${s.totalMistakes} kesalahan. Coba sekali lagi.`:"Sempurna! 好")})};
}
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeStroke()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&hwState)closeStroke()});

/* ---- global clicks ---- */
document.addEventListener("click",e=>{
  const so=e.target.closest("[data-stroke]");if(so){openStroke(so.dataset.stroke);return}
  const ls=e.target.closest("[data-lesson]");if(ls){const k=ls.dataset.lesson;openLesson(k,lessonFor(k,today()).gi);return}
  const s=e.target.closest("[data-say]");if(s){speak(s.dataset.say);return}
  const t=e.target.closest("[data-task]");if(t){const id=t.dataset.task;const on=!(S.done[today()]||[]).includes(id);markTask(id,on);render();return}
  const g=e.target.closest("[data-go]");if(g){const v=g.dataset.go;if(v==="today-gram"){const d=document.getElementById("gram");if(d){d.open=true;d.scrollIntoView({behavior:"smooth"})}}else go(v)}
});

/* ---- settings in plan: exam date ---- */
const _rPlan=rPlan;
rPlan=function(){_rPlan();V.insertAdjacentHTML("beforeend",`
  <section class="panel stack">
    <h2>Tanggal tes</h2>
    <p class="small muted">Sesuaikan dengan jadwal di bukti pendaftaranmu. Fase 7 (review) berjalan sampai tanggal ini.</p>
    <input type="date" id="exd" value="${S.examDate}" min="2026-11-15" max="2026-12-31">
  </section>
  <section class="panel stack small">
    <h2>Tentang TOCFL CAT</h2>
    <ul class="clean">
      <li>Tes berbasis komputer, dua bagian: listening dan reading. Kamu tidak memilih band; soal menyesuaikan jawabanmu dan hasilnya Level 1–6.</li>
      <li>Jumlah soal tiap bagian bervariasi (sekitar 25–40). Tes selesai saat waktu habis atau levelmu sudah terdeteksi.</li>
      <li>Level 1 (A1) disarankan ±500 kata. Tidak ada tes menulis tangan di CAT, jadi fokusnya mengenali karakter dan bunyi, bukan menulis.</li>
      <li>Level 2 (A2) disarankan ±1.000 kata. Target ini sangat ambisius dari nol dalam 1,5 bulan, jadi konsistensi harian lebih penting daripada sesi panjang sesekali.</li>
      <li><a href="https://tocfl.edu.tw/tocfl/index.php/exam/test/page/20" target="_blank" rel="noopener">Simulasi gratis resmi</a> · <a href="https://tocfl.edu.tw/OS/" target="_blank" rel="noopener">Sistem pendaftaran</a></li>
    </ul>
  </section>
  <section class="panel stack small">
    <h2>Podcast &amp; audio per fase</h2>
    <p class="muted">Tugas audio di tab Hari ini otomatis berganti sesuai fase dan hari. Podcast pemula kebanyakan beraksen Tiongkok daratan; itu tidak masalah untuk dasar. Mulai fase 4, kamu pindah ke aksen Taiwan.</p>
    ${PHASES.map(p=>`<div class="pl"><div><b>Fase ${p.id}</b><div class="d">${fmt(p.from)}</div></div><div style="min-width:0">${AUDIO[p.id].map((a,i)=>`<div><b>${esc(a.n)}</b> <span class="muted">· ${i?"Sel/Kam/Sab":"Sen/Rab/Jum/Min"}</span>${a.u?` · <a href="${a.u}" target="_blank" rel="noopener">buka</a>`:""}</div>`).join("")}</div></div>`).join("")}
    <p>Sekali dengar saja di fase 2: <a href="https://mandarinwithmisslin.buzzsprout.com/1726772/episodes/10770145-where-to-find-tocfl-resources-how-to-prepare-tocfl-band-a-i-answered-student-s-question" target="_blank" rel="noopener">episode Miss Lin tentang persiapan TOCFL Band A</a>.</p>
  </section>
  <section class="panel stack small">
    <h2>Cadangan progres</h2>
    <p class="muted">Simpan kode ini (misalnya di Notes) supaya progres bisa dipulihkan atau dipindah ke perangkat lain.</p>
    <div class="row"><button class="btn" id="bkCopy">Salin kode cadangan</button><button class="btn" id="bkLoad">Pulihkan dari kode</button></div>
    <textarea id="bk" rows="4" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--surface);font:12px/1.4 ui-monospace,monospace" placeholder="Tempel kode cadangan di sini, lalu ketuk Pulihkan"></textarea>
    <p class="muted" id="bkMsg" aria-live="polite"></p>
  </section>`);
  document.getElementById("exd").onchange=e=>{if(e.target.value){S.examDate=e.target.value;save();render()}};
  const bk=document.getElementById("bk"),msg=document.getElementById("bkMsg");
  document.getElementById("bkCopy").onclick=()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));bk.value=code;
    const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(code):Promise.reject();
    p.then(()=>{msg.textContent="Kode tersalin. Tempel di Notes atau chat ke diri sendiri."}).catch(()=>{bk.select();msg.textContent="Kode ada di kotak di atas. Salin manual."});
  };
  document.getElementById("bkLoad").onclick=()=>{
    try{const o=JSON.parse(decodeURIComponent(escape(atob(bk.value.trim()))));if(!o||typeof o.srs!=="object")throw 0;
      S=migrate(Object.assign({v:2,examDate:"2026-12-12",done:{},srs:{},custom:[],newPerDay:25,quiz:[]},o));save();render();
      document.getElementById("bkMsg").textContent="Progres dipulihkan."}
    catch(e){msg.textContent="Kode tidak bisa dibaca. Pastikan kodenya disalin utuh."}
  };
};
